# Early warning on push: the same offline suites the Pi's deploy gate runs
# in-image. The Pi's local gate remains the backstop — this just surfaces red
# before the Pi ever pulls. Keep this list in step with the loop in
# deploy/deploy.sh, or CI stops being an early warning for the gate.
name: offline-tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r deploy/requirements.txt
      - run: python tests/test_cockpit.py
      - run: python tests/test_hunt.py
