# Both services resolve cockpit:live and share ./data — the refresh job writes
# watchlist.json under the same merge-before-save protocol as the app, so they
# must never point at different volumes. deploy/deploy.sh is the ONLY thing
# that builds and retags cockpit:live (no build: key here — keeps the test
# gate unbypassable).
services:
  app:
    image: cockpit:live
    container_name: cockpit-app
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - TZ=America/New_York
      - HOME=/tmp
    volumes:
      - ./data:/app/data
    # On a Pi-hole host, /etc/resolv.conf usually points at 127.0.0.1; Docker
    # strips loopback nameservers from containers and silently falls back to
    # 8.8.8.8 (bypasses Pi-hole; breaks if the router blocks outside DNS).
    # Uncomment with the Pi's LAN IP to route container DNS through Pi-hole:
    # dns: ["192.168.1.2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # The generic short-lived container behind EVERY scheduled CLI job — not just the
  # refresh: cockpit-refresh runs it bare (the command below), while sellplan/sellexec/
  # buyexec override the command with their own CLI. A fresh container per fire mirrors
  # the old fresh-process-per-run semantics. The manual profile keeps `up -d` from ever
  # starting it.
  oneshot:
    image: cockpit:live
    profiles: ["manual"]
    user: "1000:1000"
    env_file: .env
    environment:
      - TZ=America/New_York
      - HOME=/tmp
    volumes:
      - ./data:/app/data
    # dns: ["192.168.1.2"]   # keep in sync with the app service's dns note
    command: ["python", "src/stock_screener/cockpit/refresh_job.py"]
